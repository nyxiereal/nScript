name: Validate static assets

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static and pure-function checks (PowerShell 7)
        shell: pwsh
        run: |
          ./test-get-vbox.ps1
          ./test-nscript.ps1
          ./test-nscript-windows.ps1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static and pure-function checks (Windows PowerShell 5.1)
        shell: powershell
        run: |
          ./test-get-vbox.ps1
          ./test-nscript.ps1
          ./test-nscript-windows.ps1
      - name: Smoke-test bundled WinGet (no installs)
        shell: powershell
        run: |
          Expand-Archive winget-portable.zip winget-portable
          & .\winget-portable\winget.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Portable WinGet could not start' }
          & .\winget-portable\winget.exe search --id Microsoft.PowerToys --exact --source winget --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'Portable WinGet could not use the package source' }
