name: Build and Release

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Check app installer launcher
              run: pwsh -File ./test-get-vbox.ps1

            - name: Download deps
              run: go mod download

            - name: Build Windows binaries
              run: |
                  export BINARY_NAME=nScript.exe
                  env GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
                    go build -trimpath -ldflags="-s -w" -o $BINARY_NAME main.go

            - name: Bundle portable WinGet x64
              run: |
                  # Same extracted CLI/runtime layout UniGetUI uses, from Microsoft's signed release.
                  curl -fL --retry 3 -o /tmp/winget.msixbundle https://github.com/microsoft/winget-cli/releases/download/v1.29.380/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle
                  unzip -p /tmp/winget.msixbundle AppInstaller_x64.msix > /tmp/winget-x64.msix
                  mkdir winget-portable
                  unzip -j /tmp/winget-x64.msix -d winget-portable \
                    winget.exe WindowsPackageManager.dll WindowsPackageManagerServer.exe \
                    Microsoft.Management.Configuration.dll \
                    Microsoft.Web.WebView2.Core.dll libsmartscreenn.dll resources.pri \
                    '*_app.dll'
                  python3 - <<'PY'
                  from pathlib import Path
                  from zipfile import ZipFile, ZipInfo
                  with ZipFile('winget-portable.zip', 'w') as archive:
                      for file in sorted(Path('winget-portable').iterdir()):
                          entry = ZipInfo(file.name, (2020, 1, 1, 0, 0, 0))
                          archive.writestr(entry, file.read_bytes())
                  PY
                  printf '%s  winget-portable.zip\n' "$(grep -oE '[0-9a-f]{64}' get-vbox.ps1 | head -1)" | sha256sum -c -

            - name: Upload release files
              uses: actions/upload-artifact@v4
              with:
                  name: nScript-windows-amd64
                  path: |
                      nScript.exe
                      winget-portable.zip
                      get.ps1
                      get-force.ps1
                      get-vbox.ps1
                      get.cmd
                      get-force.cmd
                      vercel.json

    smoke-test:
        needs: build
        runs-on: windows-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: nScript-windows-amd64
            - name: Verify portable WinGet CLI and package source
              shell: pwsh
              run: |
                  Expand-Archive winget-portable.zip winget-portable
                  & .\winget-portable\winget.exe --version
                  if ($LASTEXITCODE -ne 0) { throw 'Portable WinGet could not start' }
                  & .\winget-portable\winget.exe search --id Microsoft.PowerToys --exact --source winget --accept-source-agreements --disable-interactivity
                  if ($LASTEXITCODE -ne 0) { throw 'Portable WinGet could not use the package source' }

    publish:
        needs: smoke-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@v4
              with:
                  name: nScript-windows-amd64
                  path: ../dist-temp
            - name: Push binaries to dist branch
              run: |
                  git config user.name "GitHub Actions"
                  git config user.email "actions@github.com"
                  git fetch origin dist:dist
                  git checkout dist
                  git rm -rf .
                  cp -r ../dist-temp/* .
                  git add -f nScript.exe winget-portable.zip get.ps1 get-force.ps1 get-vbox.ps1 get.cmd get-force.cmd vercel.json
                  if ! git diff --cached --quiet; then
                    git commit -m "build: publish artifacts for $GITHUB_REF_NAME"
                  fi
                  git push origin dist
